<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logos/artAesthetewh.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Aesthete — Interior Design & Fine Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <!-- Google Analytics: injected only when VITE_GA_ID is set, so no placeholder
         request is made in dev or in a build without analytics configured. -->
    <script type="module">
      const gaId = import.meta.env.VITE_GA_ID;
      if (gaId) {
        const tag = document.createElement('script');
        tag.async = true;
        tag.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(tag);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gaId);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
